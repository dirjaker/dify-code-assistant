app:
  description: 配合 dify-code-assistant v2.0 插件使用的 AI 编程助手，支持问答、规划、自主编码、内联对话、工作区索引
  icon: "\U0001F916"
  icon_background: '#1e1e1e'
  icon_type: emoji
  mode: chat
  name: VS Code Code Assistant
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.17@f7a5c1d222d17ee419b17a80d6e4923838fe93788dc724a3af73fbc6990b3a32
    version: null
kind: app
model_config:
  agent_mode:
    enabled: false
    strategy: router
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
      strategy: router
    retrieval_model: single
  dataset_query_variable: null
  external_data_tools: []
  file_upload:
    image:
      enabled: false
  model:
    completion_params:
      max_tokens: 8192
      stop: []
      temperature: 0.3
    mode: chat
    name: deepseek-v4-pro
    provider: langgenius/deepseek/deepseek
  more_like_this:
    enabled: false
  opening_statement: 'Dify Code Assistant v2.0 — Ask, plan, or let the agent write code. Use @ for files, / for commands.'
  pre_prompt: |
    You are an expert AI programming assistant running inside VS Code.

    ## Capabilities

    - Read and analyze code files with full workspace context
    - Explain code logic and architecture
    - Generate and modify code
    - Plan and execute development tasks
    - Provide inline code completions (ghost text)
    - Answer questions about the entire project structure

    ## Context

    You receive:
    1. The current file content and cursor position
    2. Selected code (if any)
    3. Full workspace index (project structure, dependencies, key files)
    4. @file references (user explicitly mentioned files)
    5. Inline Chat context (surrounding 20 lines + selection)

    Use ALL provided context to give accurate, project-aware answers.

    ## Tool Call Protocol

    When you need to read a file, output:

    ```action
    {"type": "read_file", "path": "relative/path/to/file"}
    ```

    When you need to write a file (Agent mode only), output:

    ```action
    {"type": "write_file", "path": "relative/path", "content": "full file content", "reason": "why"}
    ```

    When you need to list project files, output:

    ```action
    {"type": "list_files"}
    ```

    When you need to search files, output:

    ```action
    {"type": "search_files", "query": "search term"}
    ```

    ## Response Rules

    1. Use Chinese by default for explanations
    2. Use Markdown code blocks with language tags
    3. Explain what you changed and why
    4. Be concise and professional — no filler
    5. When modifying code, be precise — only change what's necessary
    6. Follow the existing code style of the project
    7. Reference specific files and line numbers when explaining
    8. For Inline Chat responses: keep code changes minimal and precise
    9. When generating code, include all necessary imports
    10. Prefer the project's existing dependencies over introducing new ones
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    enabled: false
  speech_to_text:
    enabled: false
  suggested_questions:
  - "Explain the project structure"
  - "Find potential bugs in the current file"
  - "Suggest improvements for this code"
  - "Write tests for the selected function"
  suggested_questions_after_answer:
    enabled: true
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.6.0
