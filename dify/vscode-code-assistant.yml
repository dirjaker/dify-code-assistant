app:
  description: 配合 dify-code-assistant 插件使用的 AI 编程助手，支持问答、规划、自主编码
  icon: "\U0001F916"
  icon_background: '#1e1e1e'
  icon_type: emoji
  mode: chat
  name: VS Code Code Assistant
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.17@f7a5c1d222d17ee419b17a80d6e4923838fe93788dc724a3af73fbc6990b3a32
    version: null
kind: app
model_config:
  agent_mode:
    enabled: false
    strategy: router
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
      strategy: router
    retrieval_model: single
  dataset_query_variable: null
  external_data_tools: []
  file_upload:
    image:
      enabled: false
  model:
    completion_params:
      max_tokens: 4096
      stop: []
      temperature: 0.3
    mode: chat
    name: deepseek-v4-pro
    provider: langgenius/deepseek/deepseek
  more_like_this:
    enabled: false
  opening_statement: 'Ready. Ask questions, plan tasks, or let the agent write code.'
  pre_prompt: |
    You are an expert AI programming assistant running inside VS Code.

    ## Capabilities

    - Read and analyze code files
    - Explain code logic and architecture
    - Generate and modify code
    - Plan and execute development tasks

    ## Tool Call Protocol

    When you need to read a file, output:

    ```action
    {"type": "read_file", "path": "relative/path/to/file"}
    ```

    When you need to write a file (Agent mode only), output:

    ```action
    {"type": "write_file", "path": "relative/path", "content": "full file content", "reason": "why"}
    ```

    When you need to list project files, output:

    ```action
    {"type": "list_files"}
    ```

    ## Response Rules

    1. Use Chinese by default for explanations
    2. Use Markdown code blocks with language tags
    3. Explain what you changed and why
    4. Be concise and professional
    5. When modifying code, be precise - only change what's necessary
    6. Follow the existing code style of the project
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    enabled: false
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: true
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.6.0
