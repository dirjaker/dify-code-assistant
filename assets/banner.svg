<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="200" rx="8" fill="url(#bg)"/>
  
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="200" fill="url(#grid)"/>
  
  <text x="50" y="80" font-family="monospace" font-size="48" fill="rgba(102,126,234,0.15)">&lt;/&gt;</text>
  <text x="600" y="160" font-family="monospace" font-size="36" fill="rgba(118,75,162,0.15)">{...}</text>
  
  <rect x="60" y="60" width="80" height="80" rx="16" fill="url(#accent)" opacity="0.9"/>
  <text x="76" y="95" font-family="monospace" font-size="24" fill="white" font-weight="bold">&lt;/&gt;</text>
  <text x="80" y="120" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">AI</text>
  
  <text x="170" y="95" font-family="sans-serif" font-size="36" fill="white" font-weight="bold">Dify Code Assistant</text>
  <text x="170" y="125" font-family="sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">VS Code AI 编程助手 · 基于 Dify 平台</text>
  <rect x="170" y="140" width="60" height="3" rx="1.5" fill="url(#accent)"/>
</svg>