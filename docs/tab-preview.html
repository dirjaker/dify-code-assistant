<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Tab Bar 预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #252526; color: #ccc; display: flex; justify-content: center; padding: 40px; }
.chat-container { width: 400px; background: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; height: 550px; }

.tab-bar { display: flex; align-items: center; background: #1e1e1e; border-bottom: 1px solid #333; height: 32px; padding: 0 4px; gap: 2px; }
.tab-list { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; }
.tab-item { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: #2d2d2d; border: 1px solid #3e3e3e; border-radius: 6px 6px 0 0; font-size: 11px; color: #888; cursor: pointer; max-width: 140px; min-width: 60px; }
.tab-item:hover { background: #333; color: #ccc; }
.tab-item.active { background: #252526; color: #fff; border-bottom-color: #252526; }
.tab-item .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tab-item .tab-close { background: none; border: none; color: #666; cursor: pointer; padding: 0 2px; font-size: 11px; border-radius: 3px; opacity: 0; }
.tab-item:hover .tab-close { opacity: 1; }
.tab-item .tab-close:hover { color: #f44; background: rgba(255,68,68,0.15); }
.tab-new { background: none; border: none; color: #666; cursor: pointer; padding: 4px 6px; border-radius: 4px; display: flex; align-items: center; }
.tab-new:hover { color: #ccc; background: #333; }

.toolbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px solid #333; }
.mode-btns { display: flex; gap: 4px; }
.mode-btn { background: none; border: none; color: #888; padding: 4px 10px; border-radius: 4px; font-size: 11px; }
.mode-btn.active { background: #0078d4; color: #fff; }

.chat-area { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.step { margin: 4px 0; }
.step.user { display: flex; flex-direction: column; align-items: flex-end; margin-left: 40px; }
.step.user .step-content { background: #0078d4; color: #fff; padding: 8px 12px; border-radius: 10px 10px 2px 10px; font-size: 13px; }
.step.assistant { display: flex; flex-direction: column; align-items: flex-start; margin-right: 20px; }
.step.assistant .step-content { background: #2d2d2d; color: #ccc; padding: 10px 14px; border-radius: 10px 10px 10px 2px; border: 1px solid #3e3e3e; font-size: 13px; width: 100%; }
.step-label { font-size: 10px; color: #666; margin-bottom: 3px; padding: 0 4px; }
.step.user .step-label { color: #5a9fd4; }

.input-area { padding: 12px 16px; border-top: 1px solid #333; }
.input-row { display: flex; gap: 8px; align-items: center; }
.input-row textarea { flex: 1; background: #3c3c3c; border: 1px solid #555; border-radius: 8px; padding: 10px 12px; color: #ccc; font-size: 13px; resize: none; }
.send-btn { background: #0078d4; border: none; color: #fff; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>
<div class="chat-container">
    <!-- Tab Bar -->
    <div class="tab-bar">
        <div class="tab-list">
            <div class="tab-item">
                <span class="tab-title">帮我写一个 Python 快速排序</span>
                <button class="tab-close">&#10005;</button>
            </div>
            <div class="tab-item active">
                <span class="tab-title">Fix bugs in main.ts</span>
                <button class="tab-close">&#10005;</button>
            </div>
            <div class="tab-item">
                <span class="tab-title">New Chat</span>
                <button class="tab-close">&#10005;</button>
            </div>
        </div>
        <button class="tab-new" title="New Chat">+</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="mode-btns">
            <button class="mode-btn active">Ask</button>
            <button class="mode-btn">Plan</button>
            <button class="mode-btn">Agent</button>
        </div>
    </div>

    <!-- Chat -->
    <div class="chat-area">
        <div class="step user">
            <div class="step-label">You</div>
            <div class="step-content">帮我写一个 Python 快速排序</div>
        </div>
        <div class="step assistant">
            <div class="step-label">Assistant</div>
            <div class="step-content">好的，这是一个快速排序的实现...</div>
        </div>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="input-row">
            <textarea placeholder="Ask anything..." rows="1"></textarea>
            <button class="send-btn">&#9654;</button>
        </div>
    </div>
</div>
</body>
</html>
