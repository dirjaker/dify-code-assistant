<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Session Delete 预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #252526; 
    color: #cccccc;
    display: flex;
    justify-content: center;
    padding: 40px;
}
.chat-container {
    width: 380px;
    background: #1e1e1e;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #333;
    display: flex;
    flex-direction: column;
    height: 500px;
}

/* 工具栏 */
.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid #333;
    background: #252526;
}
.mode-btns { display: flex; gap: 4px; }
.mode-btn {
    background: none;
    border: none;
    color: #888;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
}
.mode-btn.active { background: #0078d4; color: #fff; }
.toolbar-actions { display: flex; gap: 8px; }
.icon-btn {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 14px;
}
.icon-btn.active { color: #0078d4; }

/* 会话列表 */
.session-list {
    background: #252526;
    border-bottom: 1px solid #333;
    max-height: 200px;
    overflow-y: auto;
}

.session-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.1s ease;
}

.session-item:hover { background: rgba(255,255,255,0.05); }

.session-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    min-width: 0;
}

.session-preview {
    font-size: 12px;
    color: #ccc;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.session-meta {
    font-size: 10px;
    color: #666;
}

.session-delete {
    background: none;
    border: none;
    color: #666;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
    flex-shrink: 0;
}

.session-item:hover .session-delete {
    opacity: 1;
}

.session-delete:hover {
    color: #f44;
    background: rgba(255, 68, 68, 0.1);
}

/* 聊天区域 */
.chat-area {
    flex: 1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
}

.step { position: relative; margin: 4px 0; padding: 0; }
.step.user {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    margin-left: 40px;
}
.step.user .step-content {
    background: #0078d4;
    color: #fff;
    padding: 8px 12px;
    border-radius: 10px 10px 2px 10px;
    max-width: 85%;
    font-size: 13px;
    line-height: 1.6;
}
.step.assistant {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-right: 20px;
}
.step.assistant .step-content {
    background: #2d2d2d;
    color: #ccc;
    padding: 10px 14px;
    border-radius: 10px 10px 10px 2px;
    border: 1px solid #3e3e3e;
    font-size: 13px;
    line-height: 1.65;
    width: 100%;
}
.step-label {
    font-size: 10px;
    color: #666;
    margin-bottom: 3px;
    padding: 0 4px;
}
.step.user .step-label { color: #5a9fd4; }

/* 输入区域 */
.input-area {
    padding: 12px 16px;
    border-top: 1px solid #333;
    background: #252526;
}
.input-row {
    display: flex;
    gap: 8px;
    align-items: center;
}
.input-row textarea {
    flex: 1;
    background: #3c3c3c;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 10px 12px;
    color: #ccc;
    font-size: 13px;
    resize: none;
    font-family: inherit;
}
.send-btn {
    background: #0078d4;
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

/* 标题 */
.section-title {
    font-size: 11px;
    color: #888;
    padding: 6px 12px;
    background: #2d2d2d;
    border-bottom: 1px solid #333;
}
</style>
</head>
<body>
<div class="chat-container">
    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="mode-btns">
            <button class="mode-btn active">Ask</button>
            <button class="mode-btn">Plan</button>
            <button class="mode-btn">Agent</button>
        </div>
        <div class="toolbar-actions">
            <button class="icon-btn active" title="History">&#9201;</button>
            <button class="icon-btn" title="New Chat">&#128465;</button>
            <button class="icon-btn" title="Settings">&#9881;</button>
        </div>
    </div>

    <!-- 会话列表 -->
    <div class="section-title">Recent Sessions</div>
    <div class="session-list">
        <div class="session-item">
            <div class="session-info">
                <span class="session-preview">帮我写一个 Python 快速排序</span>
                <span class="session-meta">5 msgs · 6/17 11:30</span>
            </div>
            <button class="session-delete" title="Delete">&#10005;</button>
        </div>
        <div class="session-item">
            <div class="session-info">
                <span class="session-preview">Explain this code</span>
                <span class="session-meta">3 msgs · 6/17 10:15</span>
            </div>
            <button class="session-delete" title="Delete">&#10005;</button>
        </div>
        <div class="session-item" style="background: rgba(255,255,255,0.05);">
            <div class="session-info">
                <span class="session-preview">Fix bugs in main.ts</span>
                <span class="session-meta">8 msgs · 6/16 18:42</span>
            </div>
            <button class="session-delete" title="Delete" style="opacity:1; color:#f44; background:rgba(255,68,68,0.1);">&#10005;</button>
        </div>
        <div class="session-item">
            <div class="session-info">
                <span class="session-preview">Refactor API endpoints</span>
                <span class="session-meta">12 msgs · 6/16 14:20</span>
            </div>
            <button class="session-delete" title="Delete">&#10005;</button>
        </div>
    </div>

    <!-- 聊天区域 -->
    <div class="chat-area">
        <div class="step user">
            <div class="step-label">You</div>
            <div class="step-content">帮我写一个 Python 快速排序</div>
        </div>
        <div class="step assistant">
            <div class="step-label">Assistant</div>
            <div class="step-content">好的，这是一个快速排序的实现...</div>
        </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
        <div class="input-row">
            <textarea placeholder="Ask anything..." rows="1"></textarea>
            <button class="send-btn">&#9654;</button>
        </div>
    </div>
</div>
</body>
</html>
